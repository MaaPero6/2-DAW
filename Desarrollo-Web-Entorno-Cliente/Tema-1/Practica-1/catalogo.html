<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Práctica: Consumo de CPU/RAM en Cliente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            line-height: 1.5;
        }

        .panel {
            max-width: 600px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #f9f9f9;
        }

        button {
            padding: 10px 15px;
            margin-right: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            font-weight: bold;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:hover {
            background-color: #003d80;
        }

        #consolaVisual {
            margin-top: 15px;
            padding: 12px;
            background: #222;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            border-radius: 4px;
            min-height: 80px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <div class="panel">
        <h2>Auditoría de Rendimiento en el Cliente (Front-end)</h2>
        <p>Pulsa los botones y abre las <strong>Herramientas de Desarrollador (F12)</strong> para ver las etiquetas
            temporales de la CPU del navegador.</p>

        <button id="btnGenerar">1. Generar 500000 Productos</button>
        <button id="btnOrdenar">2. Ordenar por Precio</button>
        <button id="btnFiltrar">3. Filtrar Informática</button>

        <div id="consolaVisual">Esperando interacción del usuario...</div>
    </div>

    <script src="js/catalogo.js"></script>
</body>

</html>
