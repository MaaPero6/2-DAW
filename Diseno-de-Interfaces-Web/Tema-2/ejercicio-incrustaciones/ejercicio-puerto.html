<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio Puerto Algeciras</title>
  <style>
    body {
      background-color: rgb(245, 216, 188);
      font-family: Arial, sans-serif;
    }

    h1 {
      color: navy;
      text-align: center;
    }

    h2 {
      color: maroon;
    }

    p {
      color: #333333;
      font-size: 16px;
    }

    section {
      background-color: rgb(221, 221, 221);
      border: 5px solid rgb(14, 14, 14);
      margin: 15px;
      padding: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ejercicio del Puerto usando incrustaciones</h1>
  </header>

  <main>
    <section>
      <h2>Incrustación de una imagen</h2>
      <img src="recursos/fotoBarco.jpg" alt="Foto de un barco del puerto">
    </section>

    <section>
      <h2>Incrustación de un video</h2>
      <video controls width="600">
        <source src="recursos/videoPuerto.mp4" type="video/mp4">
      </video>
    </section>

    <section>
      <h2>Incrustación de un audio</h2>
      <audio controls>
        <source src="recursos/melodia.mp3" type="audio/mpeg">
      </audio>
    </section>

    <section>
      <h2>Incrustación de una página web externa</h2>
      <iframe src="https://www.puertosdeandalucia.es/puertos/puertos/cadiz/puerto-de-algeciras" width="800" height="600"></iframe>
    </section>

    <nav>
      <p>Para la siguiente página <a href="ejercicio-puerto2.html">pulsa aquí</a></p>
    </nav>
  </main>

</body>
</html>
