<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ejercicio Puerto Algeciras parte 2</title>

  <style>
    body {
      background-color: linen;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: navy;
      text-align: center;
    }

    h2 {
      color: maroon;
    }

    section {
      background-color: white;
      border: 1px solid gray;
      margin: 15px;
      padding: 10px;
    }
  </style>
</head>

<body>
  <h1>Continuacion del ejercicio</h1>

  <!-- Incrustación de contenido externo utilizando plugins
    <embed src="contenido.swf">
  Obsoleto: Los archivos .swf dependían de Adobe Flash, 
  que fue retirado en 2020 por graves fallos de seguridad y ya no es soportado por ningún navegador moderno. -->

  <!-- Incrustación de contenido multimedia o plugins
    <object data="contenido.swf" type="application/x-shockwave-flash"></object>
  Obsoleto: Los archivos .swf dependían de Adobe Flash, 
  que fue retirado en 2020 por graves fallos de seguridad y ya no es soportado por ningún navegador moderno. -->

  <h2>Incrustación de contenido externo utilizando plugins</h2>
  <embed src="recursos/Carta_Servicios_APBA.pdf" width="800" height="600">

  <hr>
  <h2>Incrustación de contenido multimedia o plugins</h2>
  <object data="recursos/boat.svg" type="image/svg+xml" width="400" height="300"></object>

  <!-- Incrustación de un lienzo para dibujar gráficos
    <canvas id="miCanvas" width="200" height="200"></canvas>
  La etiqueta <canvas> solo reserva el lienzo en blanco en el DOM; en HTML puro permanece vacía porque requiere JavaScript para renderizar y dibujar gráficos. -->

  <hr>

  <h2>Incrustación de gráficos vectoriales escalables</h2>
  <svg width="400" height="180">
    <rect x="50" y="20" width="300" height="200" style="fill:rgba(255, 0, 0, 0.658)" />
  </svg>

  <hr>

  <p>Para la volver a la pagina anterior <a href="ejercicio-puerto.html">pulsa aqui</a></p>

</body>

</html>
