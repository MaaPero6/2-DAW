<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplos Tablas</title>
</head>

<body>
    <table border="2" align="center">
        <caption>Tabla de ejemplo</caption>
        <tr bgcolor="77DDEE">
            <th bgcolor="FF0000">H1</th>
            <th colspan="2">H2</th>

            <th colspan="3">H3</th>
        </tr>

        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
            <td rowspan="2">D</td>
            <td>E</td>
            <td rowspan="3">F</td>
        </tr>

        <tr>
            <td>G</td>
            <td rowspan="2">H</td>
            <td>I</td>
            <td>J</td>
        </tr>

        <tr>
            <td>K</td>
            <td colspan="2">L</td>
            <td>M</td>
        </tr>
    </table>
</body>

</html>
