<!DOCTYPE html>
<html lang="es">
<head>

  <title>Ejemplo de listas</title>
</head>
<body>
  <h1>Ejemplo de listas</h1>

  <h2>Lista desordenada</h2>
  <ul>
    <li>Pan</li>
    <li>Leche</li>
  </ul>

  <h2>Lista ordenada</h2>

    <li>Primero</li>
    <li>Segundo</li>
  </ol>
</body>
</html>
